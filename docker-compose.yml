services:
  namenode:
    image: apache/hadoop:3.4.1
    container_name: hadoop-namenode
    hostname: namenode
    user: root
    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./config:/opt/hadoop/etc/hadoop:ro
    command: >
      bash -c "
      if [ ! -f /tmp/hadoop-root/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force;
      fi &&
      hdfs namenode
      "

  datanode:
    image: apache/hadoop:3.4.1
    container_name: hadoop-datanode
    hostname: datanode
    user: root
    depends_on:
      - namenode

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./config:/opt/hadoop/etc/hadoop:ro

    command: >
      bash -c "
      hdfs datanode
      "

  spark:
    image: apache/spark:4.1.3
    container_name: spark
    hostname: spark
    user: root

    depends_on:
      - namenode
      - datanode
    stdin_open: true
    tty: true
    ports:
      - "4040:4040"
    volumes:
      - .:/opt/spark/work-dir/project
    command: ["/bin/bash"]
volumes:
  namenode_data:
  datanode_data:
  